<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__REGION__ · 最终入选路线</title>
<style>body{margin:0;font:15px system-ui;color:#203b49;background:#f3f6fa}header{padding:14px 18px}h2{margin:0 0 10px}select,button{padding:7px;margin:3px}a{color:#126485}main{display:flex;height:calc(100vh - 140px);min-height:360px}canvas{flex:1;min-width:0;touch-action:none;background:#edf0f2}aside{width:280px;padding:16px;overflow:auto;background:white}p{line-height:1.7}.rebuilt{color:#7d38c0}.original{color:#167c90}small{color:#657984}@media(max-width:700px){main{display:block;height:auto}canvas{width:100%;height:65vh}aside{width:auto}}</style>
<header><h2>__REGION__ · 最终入选路线</h2><span id="counts">正在加载路线…</span><select id="kind"><option value="all">全部入选路线</option><option value="rebuilt">仅重建路线</option><option value="original">仅原始路线</option></select><select id="route"><option value="">查看全部路线</option></select><label><input id="base" type="checkbox" checked>底图</label><button id="home">全范围</button><button id="city">城市中心</button><a href="index.html">查看密度与筛选依据</a></header>
<main><canvas id="map"></canvas><aside><p><span class="rebuilt">紫色：重建路线</span><br><span class="original">青色：原始路线</span></p><p>只显示本次最终入选集合，不叠加密度网格，不重新筛选或规划。保留完整几何和原有分段。</p><p id="info">点击路线，或按编号选择单条查看。滚轮以鼠标位置缩放，拖动地图平移。</p><small id="tiles">底图 © 高德。底图不可用时仍可查看内嵌路线；路线不构成导航认证。</small></aside></main>
<script type="application/json" id="data">__DATA__</script><script>
__GCJ__
const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d'),images=new Map();
const features=JSON.parse($('data').textContent).features;let selected=null,z=11,cx=0,cy=0,raf=0,drag=null;
function world(p){const[lon,lat]=gcj(p),s=256*2**18;return[(lon+180)/360*s,(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*s]}
const routes=features.map(f=>{const bounds=[Infinity,Infinity,-Infinity,-Infinity],parts=f.geometry.coordinates.map(part=>{const a=new Float64Array(part.length*2);part.forEach((p,i)=>{const[x,y]=world(p);a[i*2]=x;a[i*2+1]=y;bounds[0]=Math.min(bounds[0],x);bounds[1]=Math.min(bounds[1],y);bounds[2]=Math.max(bounds[2],x);bounds[3]=Math.max(bounds[3],y)});return a});return{id:f.properties.route_id,kind:f.properties.geometry_kind,reason:f.properties.reason,parts,bounds}});
function visible(){return routes.filter(r=>$('kind').value==='all'||r.kind===$('kind').value)}
function schedule(){if(!raf)raf=requestAnimationFrame(draw)}
function fit(list){if(!list.length){schedule();return}const b=[Infinity,Infinity,-Infinity,-Infinity];for(const r of list){b[0]=Math.min(b[0],r.bounds[0]);b[1]=Math.min(b[1],r.bounds[1]);b[2]=Math.max(b[2],r.bounds[2]);b[3]=Math.max(b[3],r.bounds[3])}z=Math.max(3,Math.min(19,18+Math.floor(Math.log2(Math.min(Math.max(40,canvas.clientWidth-60)/Math.max(1,b[2]-b[0]),Math.max(40,canvas.clientHeight-60)/Math.max(1,b[3]-b[1]))))));const scale=2**(z-18);cx=(b[0]+b[2])/2*scale;cy=(b[1]+b[3])/2*scale;schedule()}
function choose(r){selected=r;$('route').value=r?String(r.id):'';$('info').textContent=r?`路线 ${r.id} · ${r.kind==='rebuilt'?'可靠重建':'历史原始'}。${r.reason||''}。共 ${r.parts.length} 个独立分段。`:'点击路线，或按编号选择单条查看。';if(r)fit([r]);else schedule()}
function clipped(r,s,w,h){const b=r.bounds;return b[2]*s<cx-w/2-10||b[0]*s>cx+w/2+10||b[3]*s<cy-h/2-10||b[1]*s>cy+h/2+10}
function draw(){raf=0;const w=canvas.clientWidth,h=canvas.clientHeight,d=devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);if($('base').checked)for(let x=Math.floor((cx-w/2)/256);x<=Math.floor((cx+w/2)/256);x++)for(let y=Math.floor((cy-h/2)/256);y<=Math.floor((cy+h/2)/256);y++){if(y<0||y>=2**z)continue;const tx=((x%2**z)+2**z)%2**z,key=`${z}/${tx}/${y}`;let im=images.get(key);if(!im){im=new Image();im.referrerPolicy='no-referrer';im.onload=schedule;im.onerror=()=>{$('tiles').textContent='底图暂不可用，入选路线仍可查看。'};im.src=`https://wprd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x=${tx}&y=${y}&z=${z}&ltype=3`;images.set(key,im);if(images.size>400)images.delete(images.keys().next().value)}if(im.complete&&im.naturalWidth)ctx.drawImage(im,x*256-cx+w/2,y*256-cy+h/2,256,256)}
 const s=2**(z-18);for(const r of selected?[selected]:visible()){if(clipped(r,s,w,h))continue;ctx.strokeStyle=r.kind==='rebuilt'?'#7d38c0':'#167c90';ctx.lineWidth=selected?3:1.2;ctx.globalAlpha=selected?1:.65;for(const part of r.parts){ctx.beginPath();for(let i=0;i<part.length;i+=2){const x=part[i]*s-cx+w/2,y=part[i+1]*s-cy+h/2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}}
 ctx.globalAlpha=1;if(selected){const a=selected.parts[0],b=selected.parts.at(-1);for(const[p,offset,label,color]of[[a,0,'S','#217b58'],[b,b.length-2,'T','#2c3d49']]){if(!p.length)continue;const x=p[offset]*s-cx+w/2,y=p[offset+1]*s-cy+h/2;ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.fillStyle='white';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y)}}}
function pick(x,y){const w=canvas.clientWidth,h=canvas.clientHeight,s=2**(z-18);let best=null,dist=64;for(const r of visible()){if(clipped(r,s,w,h))continue;for(const a of r.parts)for(let i=2;i<a.length;i+=2){const ax=a[i-2]*s-cx+w/2,ay=a[i-1]*s-cy+h/2,bx=a[i]*s-cx+w/2,by=a[i+1]*s-cy+h/2,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1))),d=(x-ax-t*dx)**2+(y-ay-t*dy)**2;if(d<dist){dist=d;best=r}}}if(best)choose(best)}
function update(){selected=null;const list=visible();$('route').replaceChildren(new Option('查看全部路线',''));for(const r of list)$('route').add(new Option(`路线 ${r.id} · ${r.kind==='rebuilt'?'重建':'原始'}`,String(r.id)));const rebuilt=routes.filter(r=>r.kind==='rebuilt').length;$('counts').textContent=`最终 ${routes.length} 条（重建 ${rebuilt}＋原始 ${routes.length-rebuilt}）；当前显示 ${list.length} 条 `;$('info').textContent='点击路线，或按编号选择单条查看。';schedule()}
$('kind').onchange=update;$('route').onchange=()=>choose(routes.find(r=>String(r.id)===$('route').value)||null);$('base').onchange=schedule;$('home').onclick=()=>{choose(null);fit(visible())};$('city').onclick=()=>{choose(null);z=12;const p=world([104.065,30.67]),s=2**(z-18);cx=p[0]*s;cy=p[1]*s;schedule()};canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,cx,cy,moved:false};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.moved=true;cx=drag.cx-dx;cy=drag.cy-dy;schedule()};canvas.onpointerup=e=>{if(drag&&!drag.moved){const b=canvas.getBoundingClientRect();pick(e.clientX-b.left,e.clientY-b.top)}drag=null};canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();const b=canvas.getBoundingClientRect(),mx=e.clientX-b.left-canvas.clientWidth/2,my=e.clientY-b.top-canvas.clientHeight/2,next=Math.max(3,Math.min(19,z+(e.deltaY<0?1:-1))),s=2**(next-z);cx=(cx+mx)*s-mx;cy=(cy+my)*s-my;z=next;schedule()},{passive:false});new ResizeObserver(schedule).observe(canvas);update();fit(routes);
</script></html>
